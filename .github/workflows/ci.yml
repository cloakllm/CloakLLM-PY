name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# v0.6.1 H7: least-privilege defaults + cancel-on-superseding-push.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # v0.6.3 P0-1: GitHub-hosted runners ship with pip 25.2 which has known
      # CVEs (CVE-2025-8869 fixed in 25.3, CVE-2026-1703 fixed in 26.0). Upgrade
      # before pip-audit runs.
      # 2026-07-25: same class for setuptools -- runners ship 79.0.1, which has
      # PYSEC-2026-3447 (fixed in 83.0.0). Both are CI build-time tools, not
      # runtime deps of the published wheel; upgrading is the fix (no waiver).
      - name: Upgrade pip and setuptools
        run: pip install --upgrade pip setuptools

      - name: Install dependencies
        # timestamping: installs asn1crypto so the RFC 3161 verifier tests +
        # the OpenSSL-differential suite actually RUN in CI (not skip). openssl
        # ships on GitHub runners.
        # v0.12.0: spaCy moved to the [detection] extra -- CI must request it
        # explicitly or the NER suite silently skips + `spacy download` fails.
        run: pip install -e ".[dev,litellm,timestamping,detection]"

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run tests
        run: pytest tests/ -v

      # v0.6.3 NEW-9: dep CVE audit is now BLOCKING (was continue-on-error).
      # If a transitive CVE without an upstream fix appears, add `--ignore-vuln <ID>`
      # below with a dated comment naming the CVE and the reason for the exception.
      # All exemptions tracked in SECURITY_WAIVERS.md.
      - name: Audit dependencies (pip-audit)
        run: |
          pip-audit \
            --ignore-vuln ECHO-ffe1-1d3c-d9bc \
            --ignore-vuln ECHO-7db2-03aa-5591

      # v0.6.5: Build the wheel and import it from a fresh venv. The cloakllm
      # py CI already exercises real spaCy / litellm via `pip install -e ...`
      # so the upstream-API-drift class of bug is mostly caught — but a wheel
      # built with broken metadata (missing files, wrong package_data) would
      # only surface on user installs. This step closes that gap.
      #
      # Running on Python 3.12 only (one-shot smoke; matrix coverage above
      # already exercises 3.10/3.11/3.12 for the test suite).
      - name: Build wheel + import-smoke from clean venv
        if: matrix.python-version == '3.12'
        run: |
          pip install --upgrade build
          python -m build --wheel
          python -m venv /tmp/wheel-test-venv
          /tmp/wheel-test-venv/bin/pip install --quiet --upgrade pip
          # v0.12.0 smoke path 1: BARE wheel = detection-free (the release's
          # headline path). Must import, run regex-only, and NOT pull spaCy.
          /tmp/wheel-test-venv/bin/pip install --quiet dist/cloakllm-*.whl
          /tmp/wheel-test-venv/bin/python -c "
          import sys, warnings
          warnings.simplefilter('ignore')
          import cloakllm
          from cloakllm import Shield, ShieldConfig, AuditChainIntegrityError
          assert 'spacy' not in sys.modules, 'bare install must be spaCy-free'
          shield = Shield(ShieldConfig(audit_enabled=False))
          sanitized, tm = shield.sanitize('Email me at john@example.com please')
          assert '[EMAIL_0]' in sanitized, f'expected [EMAIL_0] in {sanitized!r}'
          restored = shield.desanitize(sanitized, tm)
          assert 'john@example.com' in restored, f'round-trip failed: {restored!r}'
          print(f'install-smoke 1/2 (detection-free): OK -- cloakllm {cloakllm.__version__}')
          "
          # v0.12.0 smoke path 2: [detection] extra restores NER. The extra now
          # pins click>=8 (typer 0.26 dropped click from its deps while spaCy
          # still imports it -- the v0.7.1 CI workaround, fixed at package level).
          WHEEL=$(ls dist/cloakllm-*.whl)
          /tmp/wheel-test-venv/bin/pip install --quiet "${WHEEL}[detection]"
          /tmp/wheel-test-venv/bin/python -m spacy download en_core_web_sm
          /tmp/wheel-test-venv/bin/python -c "
          import warnings
          warnings.simplefilter('ignore')
          from cloakllm import Shield, ShieldConfig
          shield = Shield(ShieldConfig(audit_enabled=False))
          sanitized, tm = shield.sanitize('Meeting with Angela Merkel from Deutsche Bank')
          assert any(t in sanitized for t in ('PERSON', 'ORG', 'GPE')), f'NER did not engage: {sanitized!r}'
          print('install-smoke 2/2 ([detection] NER): OK --', sanitized)
          "
